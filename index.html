<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Image Gallery</h1>
        
        <div class="gallery">
            <div class="image-item">
                <img src="./images/image1.jpg" alt="Image 1">
            </div>
            <div class="image-item">
                <img src="./images/image2.jpg" alt="Image 2">
            </div>
            <div class="image-item">
                <img src="./images/image3.jpg" alt="Image 3">
            </div>
            <div class="image-item">
                <img src="./images/image4.jpg" alt="Image 4">
            </div>
            <div class="image-item">
                <img src="./images/image5.jpg" alt="Image 5">
            </div>
            <div class="image-item">
                <img src="./images/image6.jpg" alt="Image 6">
            </div>
            <div class="image-item">
                <img src="./images/image7.jpg" alt="Image 7">
            </div>
            <div class="image-item">
                <img src="./images/image8.jpg" alt="Image 8">
            </div>
            <div class="image-item">
                <img src="./images/image9.jpg" alt="Image 9">
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <button class="nav-btn prev" id="prevBtn">&#10094;</button>
        <img src="" alt="" id="lightboxImg">
        <button class="nav-btn next" id="nextBtn">&#10095;</button>
        <div class="caption" id="caption"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
